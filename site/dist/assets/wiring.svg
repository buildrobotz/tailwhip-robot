<text x='30.0' y='960.0' font-size='14' text-anchor='start' font-weight='bold' fill='#1d2433'>Main runs (full list: electronics.md, Wire list)</text>
<line x1='30.0' y1='982.0' x2='60.0' y2='982.0' stroke='#d02a2a' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='986.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>P1-P13  battery -&gt; BMS -&gt; F1 -&gt; SW1 -&gt; MX1508 VM -&gt; both bucks, divider tap. 22 AWG.</text>
<line x1='30.0' y1='1004.0' x2='60.0' y2='1004.0' stroke='#1d2433' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1008.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>P8, P9, P11  BMS P- is the one ground: MX1508 -, buck IN-, charge jack -. 22 AWG.</text>
<line x1='30.0' y1='1026.0' x2='60.0' y2='1026.0' stroke='#2a62d0' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1030.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>L1 L2  U1 5 V and GND round the -y edge of the spine to the ESP32 VIN / GND pins (Dupont).</text>
<line x1='30.0' y1='1048.0' x2='60.0' y2='1048.0' stroke='#e8771b' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1052.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>S1-S4  U2 5 V -&gt; junction board (C1, two 3-pin servo headers) -&gt; tail and head servo plugs.</text>
<line x1='30.0' y1='1070.0' x2='60.0' y2='1070.0' stroke='#2f9a46' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1074.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>J1-J6  ESP32 back -&gt; junction board over the +y edge: servo signals, VSENSE, IR_L, IR_R, GND.</text>
<line x1='30.0' y1='1092.0' x2='60.0' y2='1092.0' stroke='#9aa3b2' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1096.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>M1-M4  ESP32 GPIO25 26 27 14 -&gt; MX1508 IN1-IN4, over the top edge of the spine.</text>
<line x1='30.0' y1='1114.0' x2='60.0' y2='1114.0' stroke='#8a5a2b' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1118.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>M5 M6  MX1508 MOTOR-A / -B -&gt; left / right TT motor (JST-XH), down each side of the core.</text>
<line x1='30.0' y1='1136.0' x2='60.0' y2='1136.0' stroke='#8a3fc4' stroke-width='4' stroke-linecap='round'/>
<text x='70.0' y='1140.0' font-size='12' text-anchor='start' font-weight='normal' fill='#1d2433'>I1-I8  ESP32 3V3 GND SDA SCL -&gt; GY-521 on the web; 3V3 GND on to both IR modules; D0 back up.</text>
<text x='30.0' y='1168.0' font-size='12' text-anchor='start' font-weight='normal' fill='#5b6475'>Leave a 30 mm loop on the head servo and ESP32-CAM leads for +-60 deg of pan; zip-tie every run to the spine slot pairs.</text>
</svg>
